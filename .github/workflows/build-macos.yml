name: Build on macOS

on:
  push:
    branches: [ '*' ]
  pull_request:
    branches: [ '*' ]

jobs:
  build-macos-intel:
    runs-on: macos-13

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up CMake
        uses: jwlawson/actions-setup-cmake@v2

      - name: Configure CMake
        run: >
          cmake -B ${{ github.workspace }}/build
          -DCMAKE_CXX_STANDARD=17
          -DCMAKE_BUILD_TYPE=Release
          -S ${{ github.workspace }}

      - name: Load product identity
        run: cat "${{ github.workspace }}/build/generated/product_identity.env" >> "$GITHUB_ENV"

      - name: Build
        run: cmake --build ${{ github.workspace }}/build --config Release

      - name: Debug Build Output
        run: find . -name '*.dylib'

      - name: Prepare Package folder
        run: cmake --install "${{ github.workspace }}/build" --config Release --prefix Package
        shell: bash

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PRODUCT_PACKAGE_PREFIX }}_mac_intel
          path: Package

  build-macos-arm:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up CMake
        uses: jwlawson/actions-setup-cmake@v2

      - name: Configure CMake
        run: >
          cmake -B ${{ github.workspace }}/build
          -DCMAKE_CXX_STANDARD=17
          -DCMAKE_BUILD_TYPE=Release
          -S ${{ github.workspace }}

      - name: Load product identity
        run: cat "${{ github.workspace }}/build/generated/product_identity.env" >> "$GITHUB_ENV"

      - name: Build
        run: cmake --build ${{ github.workspace }}/build --config Release

      - name: Debug Build Output
        run: find . -name '*.dylib'

      - name: Prepare Package folder
        run: cmake --install "${{ github.workspace }}/build" --config Release --prefix Package
        shell: bash

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PRODUCT_PACKAGE_PREFIX }}_mac_arm
          path: Package
