name: Build on Linux

on:
  push:
    branches: [ '*' ]
  pull_request:
    branches: [ '*' ]

jobs:
  build-linux:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up CMake
        run: sudo apt-get update && sudo apt-get install -y cmake

      - name: Configure CMake
        run: >
          cmake -B ${{ github.workspace }}/build
          -DCMAKE_CXX_STANDARD=17
          -DCMAKE_BUILD_TYPE=Release
          -S ${{ github.workspace }}

      - name: Load product identity
        run: cat "${{ github.workspace }}/build/generated/product_identity.env" >> "$GITHUB_ENV"

      - name: Build
        run: cmake --build ${{ github.workspace }}/build --config Release

      - name: Debug Build Output
        run: find . -name '*.so'

      - name: Prepare Package folder
        run: cmake --install "${{ github.workspace }}/build" --config Release --prefix Package
        shell: bash

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PRODUCT_PACKAGE_PREFIX }}_linux
          path: Package
