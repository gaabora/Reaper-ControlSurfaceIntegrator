name: Build release and preview ReaPack index

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  build-macos-intel:
    runs-on: macos-15-intel

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up CMake
        uses: jwlawson/actions-setup-cmake@v2

      - name: Configure CMake
        run: >
          cmake -B ${{ github.workspace }}/build
          -DCMAKE_CXX_STANDARD=17
          -DCMAKE_BUILD_TYPE=Release
          -S ${{ github.workspace }}

      - name: Load product identity
        run: cat "${{ github.workspace }}/build/generated/product_identity.env" >> "$GITHUB_ENV"

      - name: Build
        run: cmake --build ${{ github.workspace }}/build --config Release

      - name: Prepare release files
        run: |
          cmake --install "${{ github.workspace }}/build" --config Release --prefix Package
          cp "Package/UserPlugins/${PRODUCT_PLUGIN_FILENAME}.dylib" "${PRODUCT_PLUGIN_FILENAME}-darwin-x86_64.dylib"
          cd Package
          zip -r "../${PRODUCT_PACKAGE_PREFIX}_${GITHUB_REF_NAME}_mac_intel.zip" .
        shell: bash

      - name: Upload release files
        uses: actions/upload-artifact@v4
        with:
          name: release-macos-intel
          if-no-files-found: error
          path: |
            ${{ env.PRODUCT_PLUGIN_FILENAME }}-darwin-x86_64.dylib
            ${{ env.PRODUCT_PACKAGE_PREFIX }}_${{ github.ref_name }}_mac_intel.zip

  build-macos-arm:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up CMake
        uses: jwlawson/actions-setup-cmake@v2

      - name: Configure CMake
        run: >
          cmake -B ${{ github.workspace }}/build
          -DCMAKE_CXX_STANDARD=17
          -DCMAKE_BUILD_TYPE=Release
          -S ${{ github.workspace }}

      - name: Load product identity
        run: cat "${{ github.workspace }}/build/generated/product_identity.env" >> "$GITHUB_ENV"

      - name: Build
        run: cmake --build ${{ github.workspace }}/build --config Release

      - name: Prepare release files
        run: |
          cmake --install "${{ github.workspace }}/build" --config Release --prefix Package
          cp "Package/UserPlugins/${PRODUCT_PLUGIN_FILENAME}.dylib" "${PRODUCT_PLUGIN_FILENAME}-darwin-arm64.dylib"
          cd Package
          zip -r "../${PRODUCT_PACKAGE_PREFIX}_${GITHUB_REF_NAME}_mac_arm.zip" .
        shell: bash

      - name: Upload release files
        uses: actions/upload-artifact@v4
        with:
          name: release-macos-arm
          if-no-files-found: error
          path: |
            ${{ env.PRODUCT_PLUGIN_FILENAME }}-darwin-arm64.dylib
            ${{ env.PRODUCT_PACKAGE_PREFIX }}_${{ github.ref_name }}_mac_arm.zip

  build-windows:
    runs-on: windows-2022

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Configure CMake
        run: >
          cmake -B ${{ github.workspace }}/build
          -DCMAKE_CXX_COMPILER=cl
          -DCMAKE_C_COMPILER=cl
          -DCMAKE_BUILD_TYPE=Release
          -S ${{ github.workspace }}

      - name: Load product identity
        run: Get-Content "${{ github.workspace }}\build\generated\product_identity.env" | Add-Content -Path $env:GITHUB_ENV
        shell: pwsh

      - name: Build
        run: cmake --build ${{ github.workspace }}/build --config Release

      - name: Prepare release files
        run: |
          cmake --install "${{ github.workspace }}\build" --config Release --prefix Package
          $pluginSource = Join-Path "Package\UserPlugins" "$($env:PRODUCT_PLUGIN_FILENAME).dll"
          $pluginAsset = "$($env:PRODUCT_PLUGIN_FILENAME)-win64.dll"
          Copy-Item $pluginSource $pluginAsset
          Push-Location Package
          7z a "../$($env:PRODUCT_PACKAGE_PREFIX)_${{ github.ref_name }}_win.zip" *
          Pop-Location
        shell: pwsh

      - name: Upload release files
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          if-no-files-found: error
          path: |
            ${{ env.PRODUCT_PLUGIN_FILENAME }}-win64.dll
            ${{ env.PRODUCT_PACKAGE_PREFIX }}_${{ github.ref_name }}_win.zip

  build-linux:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up CMake
        run: sudo apt-get update && sudo apt-get install -y cmake

      - name: Configure CMake
        run: >
          cmake -B ${{ github.workspace }}/build
          -DCMAKE_CXX_STANDARD=17
          -DCMAKE_BUILD_TYPE=Release
          -S ${{ github.workspace }}

      - name: Load product identity
        run: cat "${{ github.workspace }}/build/generated/product_identity.env" >> "$GITHUB_ENV"

      - name: Build
        run: cmake --build ${{ github.workspace }}/build --config Release

      - name: Prepare release files
        run: |
          cmake --install "${{ github.workspace }}/build" --config Release --prefix Package
          cp "Package/UserPlugins/${PRODUCT_PLUGIN_FILENAME}.so" "${PRODUCT_PLUGIN_FILENAME}-linux-x86_64.so"
          cd Package
          zip -r "../${PRODUCT_PACKAGE_PREFIX}_${GITHUB_REF_NAME}_linux.zip" .
        shell: bash

      - name: Upload release files
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          if-no-files-found: error
          path: |
            ${{ env.PRODUCT_PLUGIN_FILENAME }}-linux-x86_64.so
            ${{ env.PRODUCT_PACKAGE_PREFIX }}_${{ github.ref_name }}_linux.zip

  build-config-editor:
    name: Build config editor (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS Intel
            runner: macos-15-intel
            target: bun-darwin-x64
          - label: macOS ARM
            runner: macos-latest
            target: bun-darwin-arm64
          - label: Windows x64
            runner: windows-2022
            target: bun-windows-x64
          - label: Linux x64
            runner: ubuntu-24.04
            target: bun-linux-x64
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install configuration editor dependencies
        working-directory: tools/config-editor
        run: bun install --frozen-lockfile

      - name: Compile standalone configuration editor
        working-directory: tools/config-editor
        run: bun run scripts/compile.ts ${{ matrix.target }}

      - name: Check standalone configuration editor startup
        if: runner.os != 'Windows'
        working-directory: tools/config-editor
        shell: bash
        run: |
          editor_path="$(find dist -maxdepth 1 -type f -perm -111 -name 'config-editor-*' -print -quit)"
          test -n "${editor_path}"
          editor_log="dist/config-editor-startup.log"
          "${editor_path}" --no-open > "${editor_log}" 2>&1 &
          editor_pid=$!
          editor_started=0
          for attempt_idx in {1..20}; do
            if grep -q "http://127.0.0.1:" "${editor_log}"; then
              editor_started=1
              break
            fi
            if ! kill -0 "${editor_pid}" 2>/dev/null; then
              break
            fi
            sleep 0.25
          done
          if kill -0 "${editor_pid}" 2>/dev/null; then
            kill "${editor_pid}"
          fi
          if [ "${editor_started}" -ne 1 ]; then
            cat "${editor_log}"
            exit 1
          fi

      - name: Check standalone configuration editor startup on Windows
        if: runner.os == 'Windows'
        working-directory: tools/config-editor
        shell: pwsh
        run: |
          $editorPath = Get-ChildItem -Path dist -File -Filter "config-editor-*.exe" | Select-Object -First 1
          if (-not $editorPath) { throw "Compiled configuration editor was not found" }
          $outputLog = Join-Path $editorPath.DirectoryName "config-editor-startup.log"
          $errorLog = Join-Path $editorPath.DirectoryName "config-editor-startup-error.log"
          $editorProcess = Start-Process -FilePath $editorPath.FullName -ArgumentList "--no-open" -PassThru -RedirectStandardOutput $outputLog -RedirectStandardError $errorLog
          $editorStarted = $false
          try {
            for ($attemptIdx = 0; $attemptIdx -lt 20; $attemptIdx++) {
              Start-Sleep -Milliseconds 250
              if ($editorProcess.HasExited) { break }
              if ((Get-Content $outputLog -Raw -ErrorAction SilentlyContinue) -match "http://127.0.0.1:") {
                $editorStarted = $true
                break
              }
            }
            if (-not $editorStarted) {
              Get-Content $outputLog -ErrorAction SilentlyContinue
              Get-Content $errorLog -ErrorAction SilentlyContinue
              throw "Compiled configuration editor did not start"
            }
          } finally {
            if (-not $editorProcess.HasExited) {
              Stop-Process -Id $editorProcess.Id
              Wait-Process -Id $editorProcess.Id -ErrorAction SilentlyContinue
            }
          }

      - name: Package standalone configuration editor
        if: runner.os != 'Windows'
        working-directory: tools/config-editor
        shell: bash
        run: |
          editor_path="$(find dist -maxdepth 1 -type f -perm -111 -name 'config-editor-*' -print -quit)"
          test -n "${editor_path}"
          editor_name="$(basename "${editor_path}")"
          cd dist
          zip "${editor_name}.zip" "${editor_name}"

      - name: Package standalone configuration editor on Windows
        if: runner.os == 'Windows'
        working-directory: tools/config-editor
        shell: pwsh
        run: |
          $editorPath = Get-ChildItem -Path dist -File -Filter "config-editor-*.exe" | Select-Object -First 1
          if (-not $editorPath) { throw "Compiled configuration editor was not found" }
          $archivePath = Join-Path $editorPath.DirectoryName "$($editorPath.BaseName).zip"
          Compress-Archive -Path $editorPath.FullName -DestinationPath $archivePath

      - name: Upload standalone configuration editor
        uses: actions/upload-artifact@v4
        with:
          name: release-config-editor-${{ matrix.target }}
          if-no-files-found: error
          path: tools/config-editor/dist/*.zip

  publish-release:
    needs: [build-macos-intel, build-macos-arm, build-windows, build-linux, build-config-editor]
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download release files
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Install official ReaPack indexer
        run: gem install reapack-index --version 1.2.6 --no-document

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Validate vendor surface files
        working-directory: tools/config-editor
        run: bun run src/cli.ts validate ../../resources/Surfaces/Vendor

      - name: Prepare preview ReaPack repository
        run: |
          release_version="${GITHUB_REF_NAME#v}"
          python3 tools/reapack/repository.py prepare --version "$release_version" --tag "$GITHUB_REF_NAME" --asset-dir release-assets
          git -C .reapack-build/repository init
          git -C .reapack-build/repository config user.name "ReaPack CI"
          git -C .reapack-build/repository config user.email "actions@users.noreply.github.com"
          git -C .reapack-build/repository add .
          git -C .reapack-build/repository commit -m "Generate preview package metadata for ${GITHUB_REF_NAME}"

      - name: Validate and generate preview ReaPack index
        run: |
          product_script_directory="$(sed -n 's/^PRODUCT_SCRIPT_DIRECTORY=//p' Scripts/product_identity.conf)"
          cd .reapack-build/repository
          reapack-index --check --strict .
          reapack-index --scan . --strict --no-commit --name "${product_script_directory}" --output index.xml .

      - name: Add checksums and verify index ownership
        run: python3 tools/reapack/repository.py finalize --output-dir release-assets

      - name: Upload preview index artifact
        uses: actions/upload-artifact@v4
        with:
          name: preview-reapack-index-${{ github.ref_name }}
          if-no-files-found: error
          path: |
            release-assets/index.xml
            release-assets/index.xml.sha256

      - name: Publish complete GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
