name: Build on Windows

on:
  push:
    branches: [ '*' ]
  pull_request:
    branches: [ '*' ]

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure CMake
        run: >
          cmake -B ${{ github.workspace }}/build
          -DCMAKE_CXX_COMPILER=cl
          -DCMAKE_C_COMPILER=cl
          -DCMAKE_BUILD_TYPE=Release
          -S ${{ github.workspace }}

      - name: Load product identity
        run: Get-Content "${{ github.workspace }}\build\generated\product_identity.env" | Add-Content -Path $env:GITHUB_ENV
        shell: pwsh

      - name: Build
        run: cmake --build ${{ github.workspace }}/build --config Release

      - name: Debug Build Output
        run: dir /s *.dll
        shell: cmd

      - name: Prepare Package folder
        run: cmake --install "${{ github.workspace }}\build" --config Release --prefix Package
        shell: pwsh

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PRODUCT_PACKAGE_PREFIX }}_win
          path: Package
