Device main {
  Type=MIDI
  Input=0
  Output=0
  RefreshRate=15
  MaxMessagesPerRun=200
}

Device extender {
  Type=MIDI
  Input=1
  Output=1
  RefreshRate=15
  MaxMessagesPerRun=200
}

Page "Home" {
  FollowMCP=true
  SyncPages=true
  ScrollLink=false
  ScrollSync=false

  Surface main {
    Device=main
    Template=main
    MainProfile=main
    FXProfile=main
    StartChannel=0
  }

  Surface extender {
    Device=extender
    Template=extender
    MainProfile=extender
    FXProfile=extender
    StartChannel=8
  }

  Link {
    From=main
    To=extender
    Share=[Home, Modifiers, FXMenu, SelectedTrackSends]
  }
}
