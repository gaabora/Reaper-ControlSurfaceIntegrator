Settings {
  DefaultModifierMode=Latch
  HoldDelayMs=1000
}

Device fp2 {
  Type=MIDI
  Channels=1
  Input=0
  Output=0
  RefreshRate=15
  MaxMessagesPerRun=200
}

Device x32 {
  Type=OSC
  Protocol=X32
  Channels=32
  ReceivePort=8000
  TransmitPort=9000
  Address=192.168.1.20
}

Page Home {
  FollowMCP=true
  SyncPages=true

  Surface fp2 {
    Device=fp2
    Template=spec-midi
    MainProfile=spec
    FXProfile=spec
    StartChannel=0
  }

  Surface x32 {
    Device=x32
    Template=spec-osc
    MainProfile=spec
    FXProfile=spec
    StartChannel=1
  }

  Link {
    From=fp2
    To=x32
    Share=[Home, Modifiers]
  }
}
