Version=1

# Primitive meaning and capabilities are independent from protocol encoding.
Primitive=Press Direction=Input Capabilities=Press
Primitive=Value Direction=Input Capabilities=Absolute
Primitive=Encoder Direction=Input Capabilities=Relative
Primitive=Touch Direction=Input Capabilities=Touch
Primitive=State Direction=Feedback Capabilities=Toggle
Primitive=Value Direction=Feedback Capabilities=Value
Primitive=Color Direction=Feedback Capabilities=Color
Primitive=Ring Direction=Feedback Capabilities=Value,Ring
Primitive=Bar Direction=Feedback Capabilities=Value,Bar
Primitive=Meter Direction=Feedback Capabilities=Value,Meter
Primitive=Text Direction=Feedback Capabilities=Text

# Conditional capabilities are derived from declared properties or nested blocks.
CapabilityWhen=Release Direction=Input Primitive=Press AllProperties=Off
CapabilityWhen=TrackColor Direction=Feedback Primitive=Color PropertyEquals=TrackColor:true
CapabilityWhen=Toggle Direction=Feedback Primitive=Color AllProperties=InactiveBrightness,ActiveBrightness
CapabilityWhen=Color Direction=Feedback Primitive=Ring Nested=Configure
CapabilityWhen=Color Direction=Feedback Primitive=Text ListProperty=Payload AnyListItems=BackgroundRed7,BackgroundGreen7,BackgroundBlue7,TextRed7,TextGreen7,TextBlue7
CapabilityWhen=Toggle Direction=Feedback Primitive=Text ListProperty=Payload AnyListItems=BackgroundRed7,BackgroundGreen7,BackgroundBlue7,TextRed7,TextGreen7,TextBlue7

# Nested transport blocks use the same property-rule language.
NestedBlock=Acknowledge ParentDirection=Input ParentPrimitive=Encoder Protocol=OSC Required=Encoding,Address,Value Optional=None Rules=Encoding:Enum(OSCInt),Address:OSCAddress,Value:SignedInteger
NestedBlock=Configure ParentDirection=Feedback ParentPrimitive=Ring Protocol=MIDI Required=Encoding,Payload Optional=None Rules=Encoding:Enum(MIDISysEx),Payload:NonEmptyList

# Reusable Surface profile schemas are consumed by the same document parser.
Profile=EncoderProfile Required=Increase,Decrease Optional=Delta,AccelerationDeltas Rules=Increase:MIDIDataByteList,Decrease:MIDIDataByteList,Delta:PositiveFinite,AccelerationDeltas:PositiveFiniteList
Profile=ValueProfile Required=InputUnit,OutputUnit,Direction,Interpolation Optional=None Rules=InputUnit:Enum(Normalized|Integer|Decibels),OutputUnit:Enum(Normalized|Integer|Decibels),Direction:Enum(Decode|Encode|Both),Interpolation:Enum(Linear|Step)
ProfileLine=Point ParentProfile=ValueProfile Required=Input,Output Optional=None Rules=Input:Finite,Output:Finite MinimumCount=2
Profile=ColorProfile Required=Match Optional=Default,MinimumBrightness,MaximumNeutralSaturation Rules=Match:Enum(Nearest|Exact|HueRanges),Default:NonNegativeInteger,MinimumBrightness:Finite(0|1),MaximumNeutralSaturation:Finite(0|1)
ProfileLine=Entry ParentProfile=ColorProfile Required=Color,Value Optional=None Rules=Color:RGBColor,Value:NonNegativeInteger MinimumCount=0
ProfileLine=HueRange ParentProfile=ColorProfile Required=Minimum,Maximum,Value Optional=None Rules=Minimum:Hue,Maximum:Hue,Value:NonNegativeInteger MinimumCount=0
Profile=RingProfile Required=Quantize,ValueOffset Optional=Segments,DefaultColor Rules=Quantize:Enum(Floor|Round),ValueOffset:SignedInteger,Segments:PositiveInteger,DefaultColor:RGBColor
ProfileLine=Style ParentProfile=RingProfile Argument=Enum(Dot|Fill|BoostCut|Spread) Required=Code,Steps Optional=None Rules=Code:NonNegativeInteger,Steps:PositiveInteger MinimumCount=1
Profile=BarProfile Required=Default Optional=None Rules=Default:Enum(Normal|Bipolar|Fill|Spread|Off)
ProfileLine=Style ParentProfile=BarProfile Argument=Enum(Normal|Bipolar|Fill|Spread|Off) Required=Code Optional=None Rules=Code:NonNegativeInteger MinimumCount=1
Profile=MeterProfile Required=Mode,InputUnit Optional=InputRange,OutputRange,Quantize,Default Rules=Mode:Enum(Linear|Steps),InputUnit:Enum(Normalized|Decibels),InputRange:FinitePair,OutputRange:NonNegativeIntegerPair,Quantize:Enum(Floor|Round),Default:NonNegativeInteger
ProfileLine=Step ParentProfile=MeterProfile Required=Minimum,Output Optional=None Rules=Minimum:Finite,Output:NonNegativeInteger MinimumCount=0
Profile=TextProfile Required=Encoding Optional=Width,Padding,ClearText,SilenceAsEmpty,DefaultAlignment,InvertCode,PresentationCombine Rules=Encoding:Enum(ASCII7|UTF8),Width:PositiveInteger,Padding:Enum(Space|None),ClearText:QuotedString,SilenceAsEmpty:Boolean,DefaultAlignment:Enum(Left|Center|Right),InvertCode:NonNegativeInteger,PresentationCombine:Enum(Add|BitOr)
ProfileLine=Alignment ParentProfile=TextProfile Argument=Enum(Left|Center|Right) Required=Code Optional=None Rules=Code:NonNegativeInteger MinimumCount=0

# Surface-level blocks and their direct line entries use the same property rules.
SurfaceBlock=ColorCalibration Required=None Optional=InputMax,OutputMax,NeutralTolerancePercent,RedScale,GreenScale,BlueScale,NeutralRedScale,NeutralGreenScale,NeutralBlueScale,NeutralCurve Rules=InputMax:Integer(1|255),OutputMax:Integer(1|255),NeutralTolerancePercent:Integer(0|100),RedScale:PositiveFinite,GreenScale:PositiveFinite,BlueScale:PositiveFinite,NeutralRedScale:PositiveFinite,NeutralGreenScale:PositiveFinite,NeutralBlueScale:PositiveFinite,NeutralCurve:PositiveFinite
SurfaceBlock=FeedbackGroup Required=Capability,Encoding,ColorProfile,Payload Optional=EmptyColor,UseTrackColorWhen Rules=Capability:Enum(TrackColor),Encoding:Enum(MIDISysEx),ColorProfile:Identifier,Payload:TrackColorPayload,EmptyColor:RGBColor,UseTrackColorWhen:Enum(Always|SourceTextPresent)
SurfaceLine=Slot ParentBlock=FeedbackGroup Argument=None Required=Source,Members Optional=None Rules=Source:Identifier,Members:IdentifierList MinimumCount=1
SurfaceBlock=OSKLayout Required=None Optional=None Rules=None
SurfaceBlock=Initialize Required=None Optional=None Rules=None
SurfaceLine=MIDI ParentBlock=Initialize Argument=None Required=Bytes Optional=None Rules=Bytes:MIDIInitializationMessage MinimumCount=1
SurfaceLine=Widget ParentBlock=OSKRow Argument=Identifier Required=None Optional=Shape,Width,Height,Top,Group,Label,Color,Role,PressTarget,ScrollTarget,ValueTarget,TouchTarget,RotaryStyle Rules=Shape:Identifier,Width:PositiveFinite,Height:PositiveFinite,Top:Finite,Group:Identifier,Label:QuotedString,Color:RGBColor,Role:Identifier,PressTarget:Identifier,ScrollTarget:Identifier,ValueTarget:Identifier,TouchTarget:Identifier,RotaryStyle:Identifier MinimumCount=0
SurfaceLine=Spacer ParentBlock=OSKRow Argument=None Required=None Optional=Width Rules=Width:PositiveFinite MinimumCount=0

# Each representation declares one valid primitive, protocol, and encoding combination.
# Required and Optional contain primitive-block properties. Nested contains allowed child blocks.
Representation=Press Direction=Input Protocol=MIDI Encoding=MIDIExact Required=On Optional=Off Nested=None Rules=On:MIDIMessage3,Off:MIDIMessage3
Representation=Press Direction=Input Protocol=MIDI Encoding=MIDIPrefix Required=Message Optional=None Nested=None Rules=Message:MIDIMessage2
Representation=Touch Direction=Input Protocol=MIDI Encoding=MIDIExact Required=On,Off Optional=None Nested=None Rules=On:MIDIMessage3,Off:MIDIMessage3
Representation=Value Direction=Input Protocol=MIDI Encoding=MIDI7 Required=Message Optional=ValueProfile Nested=None Rules=Message:MIDIMessage2,ValueProfile:Identifier
Representation=Value Direction=Input Protocol=MIDI Encoding=MIDI14 Required=Status Optional=ValueProfile Nested=None Rules=Status:MIDIPitchBendStatus,ValueProfile:Identifier
Representation=Value Direction=Input Protocol=MIDI Encoding=MIDISplit Required=MSBMessage,LSBMessage,Bits,Commit Optional=ValueProfile Nested=None Rules=MSBMessage:MIDIMessage2,LSBMessage:MIDIMessage2,Bits:Integer(8|14),Commit:Enum(MSB|LSB),ValueProfile:Identifier
Representation=Encoder Direction=Input Protocol=MIDI Encoding=MIDI7 Required=Message Optional=Profile,Mode Nested=None Rules=Message:MIDIMessage2,Profile:Identifier,Mode:Enum(SignedBit|SignedBitFixed|Relative7Bit) Constraints=ExactlyOne(Profile|Mode)

